<!doctype html><html><head><meta charset="utf-8"><title>ALT Presentation</title><style>body{margin:0;background:#070b13;color:#fff;font:28px system-ui;padding:5vh 7vw}.row{margin:0 0 30px}.src{color:#dce4f5}.tr{color:#aab7ff;margin-top:8px}.time{font-size:14px;color:#63708a}</style></head><body><div id="out"></div><script>const id=new URLSearchParams(location.search).get('session');async function load(){if(!id)return;const s=await fetch('/api/sessions/'+id).then(r=>r.json());document.getElementById('out').innerHTML=s.segments.slice(-8).map(x=>`<div class="row"><div class="time">${Math.floor(x.start_ms/60000)}:${String(Math.floor(x.start_ms/1000)%60).padStart(2,'0')}</div><div class="src"></div><div class="tr"></div></div>`).join('');[...document.querySelectorAll('.row')].forEach((r,i)=>{const x=s.segments.slice(-8)[i];r.querySelector('.src').textContent=x.source;r.querySelector('.tr').textContent=x.translation})}load();setInterval(load,1500)</script></body></html>
